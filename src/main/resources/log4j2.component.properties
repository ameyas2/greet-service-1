# Enable fully asynchronous logging
log4j2.contextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector

# Configure Disruptor ring buffer size
log4j2.asyncLoggerRingBufferSize=1048576

# Custom exception handler
log4j2.asyncLoggerExceptionHandler=com.example.CustomExceptionHandler

log4j2.asyncLoggerWaitStrategy=Timeout

log4j2.asyncLoggerTimeout=10