server:
  port: 10001
  servlet:
    context-path: /greet-service

spring:
  application:
    name: spring-boot-learn
  threads:
    virtual:
      enabled: true

management:
  server:
    port: 10012
    # Separate management port does NOT inherit server.servlet.context-path
    base-path: /greet-service
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always


