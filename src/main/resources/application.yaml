server:
  port: 10001
  servlet:
    context-path: /greet-service

spring:
  application:
    name: spring-boot-learn
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://192.168.29.220:5432/greet
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: GreetHikariPool

      # Connection pool sizing
      maximum-pool-size: 100
      minimum-idle: 5

      # Connection lifecycle
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000

      # Connection validation
      validation-timeout: 5000

      # PostgreSQL timezone
      connection-init-sql: SET TIME ZONE 'Asia/Kolkata'
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        #dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata

management:
  server:
    port: 10012
    # Separate management port does NOT inherit server.servlet.context-path
    base-path: /greet-service
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      hikaricp: true